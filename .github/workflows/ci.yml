name: CI

# Runs the whole test suite on every push and every pull request.
on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch/PR cancels the older, still-running run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # jsdom and puppeteer-core need a recent Node 22 (>= 22.22).
          node-version: 22
          cache: npm

      # Installs exactly the versions in package-lock.json (fails if package.json and the lockfile disagree).
      - name: Install dependencies
        run: npm ci

      # store, questions, UI flow, service worker, offline/PWA (headless Chromium) and layout checks.
      # The browser tests use the Chromium that comes with @sparticuz/chromium.
      - name: Run the test suite
        run: npm test
